<style>
/* Layout: palco escuro com um foco de luz no topo; cartões leves; voz principal em âmbar, segunda voz em verde-água. */
:root{
  color-scheme: dark;
  --bg:#140d11; --surface:#201419; --surface2:#2c1d24; --line:#3e2c34;
  --fg:#f6ede9; --muted:#bba7ad; --accent:#f2b24a; --accent-ink:#2b1a05; --v2:#5fcfc4; --v2-ink:#06201d;
  --ok:#6fd3a2; --warn:#ff8a5c; --bad:#ff6b7a;
  --glow:rgba(242,178,74,.20);
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f8f2f3; --surface:#ffffff; --surface2:#f0e7e9; --line:#decfd3;
    --fg:#2a1a20; --muted:#6c585e; --accent:#b4690e; --accent-ink:#ffffff; --v2:#0f8f87; --v2-ink:#ffffff;
    --ok:#1b8a5a; --warn:#c2551f; --bad:#c23446; --glow:rgba(180,105,14,.14);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f8f2f3; --surface:#ffffff; --surface2:#f0e7e9; --line:#decfd3;
  --fg:#2a1a20; --muted:#6c585e; --accent:#b4690e; --accent-ink:#ffffff; --v2:#0f8f87; --v2-ink:#ffffff;
  --ok:#1b8a5a; --warn:#c2551f; --bad:#c23446; --glow:rgba(180,105,14,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(130% 55% at 50% -12%,var(--glow),transparent 62%) no-repeat,var(--bg);background-color:var(--bg);color:var(--fg);font:16px/1.55 var(--body);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.1;font-weight:800}
h2{font-size:21px;font-weight:600}
.sec{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:30px 0 12px}
.sub{color:var(--muted);margin:8px 0 16px;max-width:60ch}
.eyebrow{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin:0 0 8px}
.mono{font-family:var(--mono)} .big{font-size:1.45em} .huge{font-size:2.4em;font-weight:500}
b{font-weight:700}
.fine{color:var(--muted);font-size:14px;margin:12px 0} .center{text-align:center}
.back{background:none;border:0;color:var(--accent);font:600 16px var(--body);padding:6px 0;min-height:44px;cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.crumb{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:right}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:600 16px var(--body);cursor:pointer;text-decoration:none;text-align:center;transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.exitem:focus-visible,.mod button:focus-visible,.tick:focus-visible,#nav button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 22px -8px var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;margin-top:12px;width:100%}
.btn.big{width:100%;min-height:58px;font-size:18px;margin:10px 0 4px}
.btn.sm{min-height:42px;padding:0 15px;font-size:14px}
.btn.full{flex:1 1 100%}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.controls .btn{flex:1 1 auto}

/* cartões e início */
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 92%,var(--fg)),var(--surface));border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:18px}
.card.hero{display:flex;align-items:center;gap:18px;margin-top:6px}
.card.hero:has(.btn){display:block}
.hello{margin:4px 0 8px}
.hero-t{flex:1;min-width:0} .hero-t .sub{margin:4px 0 0;font-size:15px}
.ringbox{position:relative;width:104px;height:104px;flex:none}
.ringbox svg{width:100%;height:100%}
.rg-bg{fill:none;stroke:var(--surface2);stroke-width:9}
.rg-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s}
.rg-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rg-t b{font:800 22px var(--display)} .rg-t small{font-size:11px;color:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat span{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.plan,.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li,.tasks li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.plan li.done,.tasks li.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ok);font:700 15px var(--body);display:grid;place-items:center;flex:none;padding:0}
li.done .tick{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.pt{flex:1;min-width:0;display:flex;flex-direction:column}
.pt span{color:var(--muted);font-size:14px}
.setrow{display:flex;flex-direction:column;gap:6px;margin-top:22px;font-size:14px;color:var(--muted)}
select,textarea{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px;font:16px var(--body);width:100%}

/* curso */
.prog{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--v2));border-radius:6px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em}
.pill.a{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.pill.b{background:color-mix(in srgb,var(--v2) 20%,transparent);color:var(--v2)}
.level{margin-top:28px}
.lv-h{display:flex;align-items:baseline;gap:12px}
.lv-n{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.path{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.path::before{content:'';position:absolute;left:21px;top:18px;bottom:18px;width:2px;background:var(--line)}
.mod button{position:relative;display:flex;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--fg);font:16px var(--body);cursor:pointer}
.mod.current button{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 30px -14px var(--accent)}
.mod.locked button{opacity:.62}
.node{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line);font:700 14px var(--mono);margin-top:2px}
.node svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mod.done .node,.mod.waived .node{background:color-mix(in srgb,var(--ok) 25%,var(--surface));border-color:var(--ok);color:var(--ok)}
.mod.waived .node{background:transparent}
.mod.open .node{border-color:var(--accent);color:var(--accent)}
.mb{display:flex;flex-direction:column;gap:4px;min-width:0}
.mt{font:600 18px var(--display)} .mg{color:var(--muted);font-size:14px}
.mm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.mc{font:500 12px var(--mono);color:var(--muted)}
.mh{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.lesson summary{padding:14px;font:600 17px var(--display);cursor:pointer}
.lesson p{margin:0;padding:0 14px 14px;color:var(--muted);max-width:60ch}
.note-box{background:var(--surface2);border-left:3px solid var(--accent);padding:11px 13px;border-radius:10px;margin:14px 0;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.lvl{margin:0;display:flex;flex-direction:column;gap:2px}
.lvl span{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.lvl b{font:800 26px var(--display)} .lvl small{color:var(--muted);font-size:13px}
.lvl.a span,.lvl.a b{color:var(--accent)} .lvl.b span,.lvl.b b{color:var(--v2)}
.skills{display:flex;flex-direction:column;gap:12px}

<div id="toast" class="toast" role="status" hidden></div>
<script>
/* Detecção de altura (YIN) e utilidades de notas musicais. */
(function (root) {
  'use strict';

  var NOTE_PT = ['Dó', 'Dó#', 'Ré', 'Ré#', 'Mi', 'Fá', 'Fá#', 'Sol', 'Sol#', 'Lá', 'Lá#', 'Si'];

  function yin(buf, sr, minF, maxF, thr) {
    minF = minF || 65;
    maxF = maxF || 1100;
    thr = thr || 0.12;
    var N = buf.length, W = N >> 1;
    var tauMax = Math.min(W - 2, Math.floor(sr / minF));
    var tauMin = Math.max(2, Math.floor(sr / maxF));
    var d = new Float32Array(tauMax + 2);
    for (var tau = 1; tau <= tauMax; tau++) {
      var s = 0;
      for (var i = 0; i < W; i++) {
        var x = buf[i] - buf[i + tau];
        s += x * x;
      }
      d[tau] = s;
    }
    var cm = new Float32Array(tauMax + 2);
    cm[0] = 1;
    var run = 0;
    for (var t = 1; t <= tauMax; t++) {
      run += d[t];
      cm[t] = run > 0 ? (d[t] * t) / run : 1;
    }
    var best = -1;
    for (var k = tauMin; k < tauMax; k++) {
      if (cm[k] < thr) {
        while (k + 1 < tauMax && cm[k + 1] < cm[k]) k++;
        best = k;
        break;
      }
    }
    if (best < 0) return { freq: 0, clarity: 0 };
    var x0 = cm[best - 1], x1 = cm[best], x2 = cm[best + 1];
    var den = x0 + x2 - 2 * x1;
    var shift = den !== 0 ? (x0 - x2) / (2 * den) : 0;
    if (shift > 1 || shift < -1) shift = 0;
    return { freq: sr / (best + shift), clarity: 1 - x1 };
  }

  function freqToMidi(f) {
    return 69 + 12 * Math.log2(f / 440);
  }
  function midiToFreq(m) {
    return 440 * Math.pow(2, (m - 69) / 12);
  }
  function noteBase(m) {
    var r = Math.round(m);
    return NOTE_PT[((r % 12) + 12) % 12];
  }
  function noteLabel(m) {
    var r = Math.round(m);
    return noteBase(r) + (Math.floor(r / 12) - 1);
  }
  /* Diferença em cents até o alvo, ignorando a oitava (-600 a +600). */
  function devCents(midi, target) {
    var d = midi - target;
    d = ((((d + 6) % 12) + 12) % 12) - 6;
    return d * 100;
  }

  var api = {
    NOTE_PT: NOTE_PT,
    yin: yin,
    freqToMidi: freqToMidi,
    midiToFreq: midiToFreq,
    noteBase: noteBase,
    noteLabel: noteLabel,
    devCents: devCents
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Pitch = api;
})(typeof self !== 'undefined' ? self : this);

;
/* Base do app: utilidades, estado, microfone, sons, painéis ao vivo. */
(() => {
  'use strict';
  const CT = (window.CT = {});
  const P = (CT.P = Pitch);

  /* ---------- utilidades ---------- */
  CT.$ = (s, r) => (r || document).querySelector(s);
  CT.$$ = (s, r) => [...(r || document).querySelectorAll(s)];
  CT.sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  CT.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  CT.avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
  CT.stdev = (a) => {
    if (a.length < 2) return 0;
    const m = CT.avg(a);
    return Math.sqrt(CT.avg(a.map((x) => (x - m) * (x - m))));
  };
  CT.median = (a) => {
    const s = a.slice().sort((x, y) => x - y), n = s.length;
    return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0;
  };
  CT.percentile = (a, p) => {
    const s = a.slice().sort((x, y) => x - y);
    return s[CT.clamp(Math.round((s.length - 1) * p), 0, s.length - 1)];
  };
  CT.fmt1 = (n) => (Math.round(n * 10) / 10).toString().replace('.', ',');
  CT.esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const { $, $$, sleep, clamp, avg, median } = CT;

  /* ---------- estado salvo ---------- */
  const KEY = 'canto-v1';
  const defState = () => ({
    range: null, history: [], bests: {}, checks: {}, pref: {}, sens: 'med',
    course: { passed: {}, waived: {} }, placement: null
  });
  function loadState() {
    try {
      const j = JSON.parse(localStorage.getItem(KEY));
      if (j) return Object.assign(defState(), j);
    } catch (e) {}
    return defState();
  }
  CT.S = loadState();
  if (!CT.S.course) CT.S.course = { passed: {}, waived: {} };
  CT.save = () => { try { localStorage.setItem(KEY, JSON.stringify(CT.S)); } catch (e) {} };
  CT.resetState = () => { CT.S = defState(); CT.save(); };

  CT.dayKey = (d) => {
    d = d || new Date();
    const m = d.getMonth() + 1, dd = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
  };
  CT.calcStreak = () => {
    const days = {};
    CT.S.history.forEach((h) => { days[CT.dayKey(new Date(h.t))] = 1; });
    Object.keys(CT.S.checks).forEach((k) => {
      if (Object.keys(CT.S.checks[k]).some((x) => CT.S.checks[k][x])) days[k] = 1;
    });
    const d = new Date();
    let n = 0;
    if (!days[CT.dayKey(d)]) d.setDate(d.getDate() - 1);
    while (days[CT.dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  };
  CT.addHistory = (type, data, txt) => {
    const S = CT.S;
    S.history.push(Object.assign({ t: Date.now(), type, txt }, data));
    if (S.history.length > 500) S.history.shift();
    const k = CT.dayKey();
    S.checks[k] = S.checks[k] || {};
    S.checks[k][type] = true;
    CT.save();
  };

  /* ---------- execução e limpeza ---------- */
  CT.Run = { id: 0, hooks: [] };
  CT.onCleanup = (fn) => CT.Run.hooks.push(fn);
  CT.cleanupRun = () => {
    CT.Run.id++;
    CT.Live.unmount();
    CT.Roll.unmount();
    CT.Mic.stop();
    CT.Mic.listeners.clear();
    CT.stopTones();
    CT.Run.hooks.splice(0).forEach((fn) => { try { fn(); } catch (e) {} });
  };

  /* ---------- microfone ---------- */
  const GATES = { high: 0.006, med: 0.012, low: 0.025 };
  CT.GATES = GATES;
  const Mic = (CT.Mic = {
    ctx: null, stream: null, analyser: null, buf: null,
    listeners: new Set(), timer: 0, running: false, recent: [], lastVoiced: 0,
    ensureCtx() {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      return this.ctx;
    },
    async start() {
      if (this.running) return true;
      try {
        const ctx = this.ensureCtx();
        if (ctx.state === 'suspended') await ctx.resume();
        if (!this.stream) {
          this.stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
          });
          const src = ctx.createMediaStreamSource(this.stream);
          this.analyser = ctx.createAnalyser();
          this.analyser.fftSize = 2048;
          this.analyser.smoothingTimeConstant = 0;
          src.connect(this.analyser);
          this.buf = new Float32Array(this.analyser.fftSize);
          this.analyser2 = ctx.createAnalyser();
          this.analyser2.fftSize = 8192;
          this.analyser2.smoothingTimeConstant = 0.2;
          src.connect(this.analyser2);
          this.fbuf = new Float32Array(this.analyser2.frequencyBinCount);
        }
      } catch (e) {
        CT.micError(e);
        return false;
      }
      this.running = true;
      this.recent = [];
      clearInterval(this.timer);
      this.timer = setInterval(() => this.tick(), 25);
      return true;
    },
    stop() {
      this.running = false;
      clearInterval(this.timer);
    },
    release() {
      this.stop();
      if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
      this.stream = null;
      this.analyser = null;
      this.analyser2 = null;
    },
    /* Vetor de 12 classes de altura (Dó=0) a partir do espectro, para reconhecer acordes. */
    chroma() {
      if (!this.analyser2) return null;
      const a = this.analyser2, f = this.fbuf;
      a.getFloatFrequencyData(f);
      const binHz = this.ctx.sampleRate / a.fftSize;
      const c = new Float32Array(12);
      let energy = 0;
      const lo = Math.ceil(70 / binHz), hi = Math.floor(1300 / binHz);
      for (let i = Math.max(lo, 1); i < hi; i++) {
        if (!(f[i] > f[i - 1] && f[i] >= f[i + 1]) || f[i] < -85) continue;
        const mag = Math.pow(10, f[i] / 20);
        const midi = 69 + 12 * Math.log2((i * binHz) / 440);
        const pc = ((Math.round(midi) % 12) + 12) % 12;
        c[pc] += mag;
        energy += mag;
      }
      return { c, energy };
    },
    tick() {
      if (!this.running || !this.analyser) return;
      const b = this.buf;
      this.analyser.getFloatTimeDomainData(b);
      let s = 0;
      for (let i = 0; i < b.length; i++) s += b[i] * b[i];
      const rms = Math.sqrt(s / b.length);
      const gate = GATES[CT.S.sens] || GATES.med;
      const now = performance.now();
      let midi = null, raw = null;
      if (rms > gate) {
        const r = P.yin(b, this.ctx.sampleRate);
        if (r.freq > 0 && r.clarity > 0.8) {
          raw = P.freqToMidi(r.freq);
          this.recent.push(raw);
          if (this.recent.length > 5) this.recent.shift();
          this.lastVoiced = now;
          midi = median(this.recent);
        }
      }
      if (midi === null && now - this.lastVoiced > 150) this.recent = [];
      const f = { t: now, rms, sound: rms > gate, midi, raw };
      this.listeners.forEach((fn) => fn(f));
    }
  });
  CT.micError = (e) => {
    let msg = 'Não consegui abrir o microfone.';
    const n = e && e.name;

      }
      const devs = v.map((f) => P.devCents(f.midi, target));
      const mean = avg(devs), sd = stdev(devs);
      const inTune = (100 * devs.filter((d) => Math.abs(d) <= 25).length) / devs.length;
      const score = Math.round(clamp(0.55 * inTune + 0.45 * Math.max(0, 100 - sd * 2), 0, 100));
      let win = bestOf('sustainDur', dur, { label: 'duração', unit: ' s' });
      if (dur >= 2) {
        win += bestOf('sustainInTune', inTune, { label: 'tempo afinado', unit: '%', dec: 0 }) +
          bestOf('sustainStd', sd, { label: 'estabilidade (oscilação)', unit: '¢', higher: false, dec: 0 });
      }
      const tend = Math.abs(mean) < 10 ? 'centrado na nota' : mean > 0 ? 'tende a ficar alto' : 'tende a ficar baixo';
      const okDur = !spec.dur || dur >= spec.dur, okTune = !spec.inTune || inTune >= spec.inTune, okSd = !spec.sd || sd <= spec.sd;
      const need = [!okDur ? 'duração ' + fmt1(dur) + ' de ' + spec.dur + ' s' : '', !okTune ? 'afinado ' + Math.round(inTune) + '% de ' + spec.inTune + '%' : '',
        !okSd ? 'oscilação ±' + Math.round(sd) + ' (máx ±' + spec.sd + ')' : ''].filter(Boolean).join('; ');
      present(ctx, spec, {
        pass: okDur && okTune && okSd, need, score, type: 'sustain',
        data: { score, dur, inTune, sd, mean, target },
        txt: 'Sustentar ' + P.noteLabel(target) + ': ' + fmt1(dur) + ' s, ' + Math.round(inTune) + '% afinado, oscilação ±' + Math.round(sd) + '¢, ' + tend + ', pontuação ' + score,
        prompt: 'Pontuação <b class="mono big">' + score + '</b> de 100', win,
        html: tiles([
          { l: 'Duração', v: fmt1(dur), u: ' s' },
          { l: 'Afinado', v: Math.round(inTune), u: '%', n: 'dentro de ±25¢' },
          { l: 'Oscilação', v: '±' + Math.round(sd), u: '¢', n: sd < 12 ? 'bem firme' : sd < 25 ? 'firme com variações' : 'ainda balançando' },
          { l: 'Tendência', v: Math.abs(Math.round(mean)), u: '¢', n: tend }
        ]) + '<p class="fine">Se a nota cai no fim, falta ar constante, não força. Solte menos ar no início e mantenha o mesmo fluxo.</p>',
        extra: [{ label: 'Meio-tom acima', fn: () => { target = CT.clampTarget(target + 1); S.pref.sustain = target; CT.save(); idle(); } }]
      }, idle);
    }
    idle();
  }

  /* ---------- tempo de fôlego ---------- */
  function mpt(spec, ctx) {
    const rid = shell('Tempo de fôlego', 'Respire fundo e solte o som o mais longo possível, com volume parelho. O cronômetro corre sozinho.', 'none', ctx);
    const alive = () => CT.Run.id === rid;
    const S = CT.S;
    let mode = S.pref.mptMode || 'ah';
    function idle() {
      X.prompt('Som: <b>' + (mode === 'ah' ? '"ahhh" numa nota confortável' : '"sssss" (só ar)') + '</b>.' + (spec.min ? '<br><span class="fine">Meta: ' + spec.min + ' s.</span>' : ''));
      X.controls([
        { label: mode === 'ah' ? 'Trocar para "sss"' : 'Trocar para "ah"', kind: 'sm', fn: () => { mode = mode === 'ah' ? 'ss' : 'ah'; S.pref.mptMode = mode; CT.save(); idle(); } },
        { label: 'Começar', kind: 'primary full', fn: run }
      ]);
      X.result('');
    }
    async function run() {
      if (!(await Mic.start())) return;
      X.result('');
      const c = collect(); let stop = false; const t0 = performance.now();
      X.prompt('Respire fundo… e comece o som.');
      X.controls([{ label: 'Parar', kind: 'danger', fn: () => { stop = true; } }]);
      const timer = setInterval(() => {
        if (!alive()) { clearInterval(timer); return; }
        if (c.firstS != null) X.prompt('<span class="mono huge">' + fmt1((performance.now() - c.firstS) / 1000) + ' s</span>');
      }, 100);
      await until(() => {
        if (!alive() || stop) return true;
        const now = performance.now();
        if (c.firstS == null) return now - t0 > 10000;
        return now - c.lastS > 500 || now - c.firstS > 60000;
      });
      clearInterval(timer);
      c.stop();
      if (!alive()) return;
      if (c.firstS == null) {
        X.prompt('Não ouvi som. Chegue mais perto ou aumente a sensibilidade no Início.');
        X.controls([{ label: 'Tentar de novo', kind: 'primary', fn: idle }]);
        return;
      }
      const dur = (c.lastS - c.firstS) / 1000;
      const db = c.frames.filter((f) => f.sound && f.t >= c.firstS + 500 && f.t <= c.lastS).map((f) => 20 * Math.log10(f.rms));
      const vol = db.length > 10 ? stdev(db) : 0;
      const steady = Math.round(clamp(100 - vol * 8, 0, 100));
      const win = bestOf('mpt', dur, { label: 'tempo de fôlego', unit: ' s' }) +
        (db.length > 10 ? bestOf('steady', steady, { label: 'constância do volume', unit: '%', dec: 0 }) : '');
      const ok = !spec.min || dur >= spec.min;
      present(ctx, spec, {
        pass: ok, need: 'Você segurou ' + fmt1(dur) + ' s de ' + spec.min + ' s.', score: Math.min(100, Math.round((dur / (spec.min || 20)) * 100)),
        type: 'mpt', data: { dur, steady, mode },
        txt: 'Tempo de fôlego (' + (mode === 'ah' ? 'ah' : 'sss') + '): ' + fmt1(dur) + ' s, constância ' + steady + '%',
        prompt: 'Você sustentou <b class="mono big">' + fmt1(dur) + ' s</b>', win,
        html: tiles([
          { l: 'Duração', v: fmt1(dur), u: ' s', n: dur < 10 ? 'ponto de partida' : dur < 20 ? 'faixa comum de quem treina' : 'ótimo controle' },
          { l: 'Constância', v: steady, u: '%', n: steady > 75 ? 'fluxo bem parelho' : 'o volume oscilou, solte o ar mais regular' }
        ]) + '<p class="fine">Referência geral: adultos costumam ficar entre 15 e 25 s. O mais útil é a sua evolução semana a semana.</p>'
      }, idle);
    }
    idle();
  }

  /* ---------- respiração guiada ---------- */
  function breath(spec, ctx) {
    const rid = shell('Respiração guiada', 'Inspire pelo nariz sentindo barriga e costelas abrirem, segure um instante e solte em "sssss" constante.', 'none', ctx);
    let stopped = false;
    const alive = () => CT.Run.id === rid && !stopped;
    const S = CT.S;
    let E = spec.E || S.pref.breathE || 10;
    const cycles = 4;
    $('#prompt').insertAdjacentHTML('beforebegin', '<div class="breath"><div class="ring" id="ring"></div><div class="bl" id="bl">Pronto?</div></div><div class="vol"><i id="volbar"></i></div>');
    function idle() {
      stopped = false;
      X.prompt('Expiração de <b>' + E + ' s</b> por ciclo, ' + cycles + ' ciclos.' + (spec.pct ? '<br><span class="fine">Meta: som em ' + spec.pct + '% do tempo.</span>' : ''));
      const b = [];
      if (ctx.mode === 'free') {
        b.push({ label: 'Mais curto', kind: 'sm', fn: () => { E = Math.max(6, E - 2); S.pref.breathE = E; CT.save(); idle(); } });
        b.push({ label: 'Mais longo', kind: 'sm', fn: () => { E = Math.min(20, E + 2); S.pref.breathE = E; CT.save(); idle(); } });
      }
      b.push({ label: 'Começar', kind: 'primary full', fn: run });
      X.controls(b);
      X.result('');
    }
    async function run() {
      if (!(await Mic.start())) return;
      X.result(''); stopped = false;
      X.controls([{ label: 'Parar', kind: 'danger', fn: () => { stopped = true; } }]);
      const ring = $('#ring'), bl = $('#bl'), bar = $('#volbar');
      const vfn = (f) => { bar.style.width = clamp(f.rms / 0.1, 0, 1) * 100 + '%'; };
      Mic.listeners.add(vfn);
      const results = [];
      const phase = (txt, sc, secs) => { bl.textContent = txt; ring.style.transition = 'transform ' + secs + 's linear'; ring.style.transform = 'scale(' + sc + ')'; };
      for (let i = 1; i <= cycles && alive(); i++) {
        phase('Inspire  (' + i + '/' + cycles + ')', 1, 4); await sleep(4000); if (!alive()) break;
        phase('Segure', 1, 2); await sleep(2000); if (!alive()) break;
        phase('Solte  "sssss"', 0.45, E);
        const c = collect(), t0 = performance.now();
        await until(() => !alive() || performance.now() - t0 >= E * 1000, 50);
        c.stop();
        if (!alive()) break;
        const snd = c.frames.filter((f) => f.sound).length;
        results.push({ pct: c.frames.length ? (100 * snd) / c.frames.length : 0, kept: Math.min(E, c.lastS ? (c.lastS - t0) / 1000 : 0) });
        phase('Relaxe', 0.45, 1); await sleep(1500);
      }
      Mic.listeners.delete(vfn);
      if (CT.Run.id !== rid) return;
      if (stopped) { bl.textContent = 'Pronto?'; ring.style.transform = 'scale(0.45)'; idle(); return; }
      bl.textContent = 'Fim';
      const avgPct = avg(results.map((r) => r.pct)), avgKept = avg(results.map((r) => r.kept));
      const win = bestOf('breathPct', avgPct, { label: 'ar mantido', unit: '%', dec: 0 });
      const ok = !spec.pct || avgPct >= spec.pct;
      present(ctx, spec, {
        pass: ok, need: 'Som em ' + Math.round(avgPct) + '% do tempo (meta ' + spec.pct + '%).', score: Math.round(avgPct),
        type: 'breath', data: { pct: avgPct, E, kept: avgKept },
        txt: 'Respiração guiada (' + E + ' s): ar mantido em ' + Math.round(avgPct) + '% do tempo, média ' + fmt1(avgKept) + ' s',
        prompt: 'Ciclos concluídos.', win,
        html: tiles([
          { l: 'Ar mantido', v: Math.round(avgPct), u: '%', n: 'do tempo de expiração' },
          { l: 'Duração média', v: fmt1(avgKept), u: ' s', n: 'de ' + E + ' s pedidos' }
        ]) + (avgPct >= 90 ? '<p class="fine">Você completou o tempo com folga. Dá para aumentar 2 s.</p>' : '<p class="fine">Se o som some antes do fim, reduza o tempo e aumente aos poucos.</p>')
      }, idle);
    }
    idle();
  }

  /* ---------- sirene (glissando) ---------- */
  function glide(spec, ctx) {
    const rid = shell('Sirene', 'Deslize do grave ao agudo, como uma sirene, sem pular nem cortar o som.', 'live', ctx);
    const alive = () => CT.Run.id === rid;
    const S = CT.S;
    const want = spec.semis === 'auto'
      ? (S.range ? Math.min(12, Math.round((S.range.high - S.range.low) * 0.6)) : 8)
      : spec.semis || 5;
    function idle() {
      CT.Live.target = null;
      X.prompt('Cante "u" ou "ng" em volume baixo e suba devagar, em uns 6 s. Meta: <b>' + want + ' semitons</b> contínuos.');
      X.controls([{ label: 'Começar', kind: 'primary full', fn: run }]);
      X.result('');
    }
    async function run() {
      if (!(await Mic.start())) return;
      X.result(''); X.controls([]);
      const start = S.range ? S.range.low + 2 : 48;
      X.prompt('Ouça a nota inicial e comece daí.');
      await CT.playTone(start, 1.1);
      if (!alive()) return;
      X.prompt('Deslize agora, devagar, sem parar.');
      let stop = false;
      const c = collect(), t0 = performance.now();
      X.controls([{ label: 'Parar', kind: 'danger', fn: () => { stop = true; } }]);
      await until(() => {
        if (!alive() || stop) return true;
        const now = performance.now();
        if (c.firstT == null) return now - t0 > 8000;
        return now - c.lastT > 900 || now - c.firstT > 15000;
      });
      c.stop();
      if (!alive()) return;
      if (c.firstT == null) { X.prompt('Não ouvi o deslize.'); X.controls([{ label: 'Tentar de novo', kind: 'primary', fn: idle }]); return; }
      const fr = c.frames.filter((f) => f.t >= c.firstT && f.t <= c.lastT);
      const voiced = fr.filter((f) => f.raw != null);
      if (voiced.length < 20) { X.prompt('Deslize curto demais. Tente de novo mais longo.'); X.controls([{ label: 'Tentar de novo', kind: 'primary', fn: idle }]); return; }
      const ps = voiced.map((f) => f.raw);
      const cover = percentile(ps, 0.95) - percentile(ps, 0.05);
      const cont = voiced.length / fr.length;
      let smooth = 0;
      for (let i = 1; i < ps.length; i++) if (Math.abs(ps[i] - ps[i - 1]) < 1.2) smooth++;
      smooth /= ps.length - 1;
      const win = bestOf('glideSpan', cover, { label: 'sirene', unit: ' semitons', dec: 0 });
      const ok = cover >= want && cont >= (spec.cont || 0.6);
      const need = (cover < want ? 'Você cobriu ' + Math.round(cover) + ' de ' + want + ' semitons. ' : '') + (cont < (spec.cont || 0.6) ? 'Som contínuo em ' + Math.round(cont * 100) + '% (meta ' + Math.round((spec.cont || 0.6) * 100) + '%).' : '');
      present(ctx, spec, {
        pass: ok, need, score: Math.round(Math.min(100, (cover / want) * 100 * Math.min(1, cont / (spec.cont || 0.6)))),
        type: 'glide', data: { cover, cont, smooth },
        txt: 'Sirene: ' + Math.round(cover) + ' semitons, contínuo em ' + Math.round(cont * 100) + '%, suavidade ' + Math.round(smooth * 100) + '%',
        prompt: 'Você deslizou <b class="mono big">' + Math.round(cover) + '</b> semitons', win,
        html: tiles([
          { l: 'Extensão coberta', v: Math.round(cover), u: ' semitons', n: 'meta ' + want },
          { l: 'Continuidade', v: Math.round(cont * 100), u: '%', n: cont > 0.8 ? 'sem cortar' : 'o som cortou no caminho' },
          { l: 'Suavidade', v: Math.round(smooth * 100), u: '%', n: smooth > 0.85 ? 'sem pulos' : 'houve pulos ou quebras' }
        ]) + '<p class="fine">Se quebrar no meio, repita mais baixo e mais leve ali. Não aumente a força.</p>'
      }, idle);
    }
    idle();
  }

  /* ---------- degraus, terças, intervalos e ouvido ---------- */
  function steps(spec, ctx) {
    const kind = spec.kind;
    const voice = spec.voice || 'main';
    const shift = CT.VOICES[voice].shift;
    const title = kind === 'ear' ? 'Acertar de ouvido' : kind === 'pairs' ? 'Intervalos' : voice === 'main' ? 'Escala guiada' : CT.VOICES[voice].name.replace('Segunda voz: ', 'Segunda voz, ');
    const subs = {
      ear: 'O app toca uma nota sem mostrar o nome. Cante a mesma. Treina o ouvido interno.',
      pairs: 'O app toca uma nota. Você canta outra, a pedida. Treina intervalos de ouvido.',
      steps: voice === 'main' ? 'O app toca cada degrau e você canta o mesmo.' : 'O app toca a melodia e você canta a segunda voz. A nota que você deve cantar aparece no gráfico.'
    };
    const rid = shell(title, subs[kind === 'ear' ? 'ear' : kind === 'pairs' ? 'pairs' : 'steps'], 'live', ctx);
    let stopped = false;
    const alive = () => CT.Run.id === rid && !stopped;
    const S = CT.S;
    let guide = spec.guide || 'melody';
    const keyBase = 'root_' + kind + '_' + (spec.pattern || '') + '_' + voice;
    const pairDegs = kind === 'pairs' ? spec.pairs : (CT.PATTERNS[spec.pattern] ? CT.PATTERNS[spec.pattern].degs.map((d) => [d, d + shift]) : []);
    let root = S.pref[keyBase] != null ? S.pref[keyBase] : kind === 'ear' ? CT.defaultTarget() : CT.fitTonic(pairDegs.map((p) => p[1]).concat(pairDegs.map((p) => p[0])));
    function build() {
      if (kind === 'ear') {
        const lo = S.range ? S.range.low + 2 : 50, hi = S.range ? S.range.high - 2 : 64;
        let cur = clamp(Math.round((lo + hi) / 2), lo, hi);
        const out = [];
        const n = spec.n || 5;
        for (let i = 0; i < n; i++) {
          out.push({ play: cur, target: cur, hide: true });
          let j = (2 + Math.floor(Math.random() * 4)) * (Math.random() < 0.5 ? -1 : 1);
          if (cur + j < lo || cur + j > hi) j = -j;
          cur = clamp(cur + j, lo, hi);
        }
        return out;
      }
      return pairDegs.map((p) => ({ play: CT.degMidi(root, p[0]), target: CT.degMidi(root, p[1]) }));
    }
    const needTxt = spec.hits ? ' Meta: ' + spec.hits + '% de acertos.' : '';
    function idle() {
      stopped = false;
      CT.Live.target = null;
      const lab = kind === 'ear' ? 'Notas sorteadas dentro da sua extensão. O nome não aparece.' : 'Tom: <b class="mono big">' + P.noteLabel(root) + '</b>';
      X.prompt(lab + '<span class="fine">' + needTxt + '</span>' + (voice !== 'main' ? '<br><span class="fine">Cante a nota <b>' + (shift > 0 ? 'mais alta' : 'mais baixa') + '</b> que a melodia que toca.</span>' : ''));
      const b = [];
      if (kind !== 'ear') {
        b.push({ label: '‹ meio-tom', kind: 'sm', fn: () => { root--; S.pref[keyBase] = root; CT.save(); idle(); } });
        b.push({ label: 'meio-tom ›', kind: 'sm', fn: () => { root++; S.pref[keyBase] = root; CT.save(); idle(); } });
      }
      if (voice !== 'main' && ctx.mode === 'free') {
        b.push({ label: 'Guia: ' + (guide === 'melody' ? 'melodia' : 'sua nota'), kind: 'sm', fn: () => { guide = guide === 'melody' ? 'target' : 'melody'; idle(); } });
      }
      b.push({ label: 'Começar', kind: 'primary full', fn: run });
      X.controls(b);
      X.result('<p class="fine">Use fones para o app não ouvir o tom que ele mesmo toca.</p>');
    }
    async function run() {
      if (!(await Mic.start())) return;
      const list = build();
      const chips = list.map(() => ({ cls: '', txt: '·' }));
      const paint = () => X.result('<div class="chips">' + chips.map((c) => '<span class="chip ' + c.cls + '">' + c.txt + '</span>').join('') + '</div>');
      paint();
      X.controls([{ label: 'Parar', kind: 'danger', fn: () => { stopped = true; } }]);
      const res = [];
      for (let i = 0; i < list.length && alive(); i++) {
        const st = list[i];
        CT.Live.target = null;
        const same = st.play === st.target;
        X.prompt(st.hide ? 'Ouça…' : same ? 'Ouça <b>' + P.noteBase(st.play) + '</b> e cante a mesma.'
          : 'Ouça <b>' + P.noteBase(st.play) + '</b>. Cante <b>' + P.noteBase(st.target) + '</b>.');
        await CT.playTone(guide === 'target' ? st.target : st.play, 0.9);
        if (!alive()) break;
        await sleep(120);
        CT.Live.target = st.target;
        X.prompt(st.hide ? 'Cante a nota que ouviu.' : 'Cante <b>' + P.noteBase(st.target) + '</b>');
        const c = collect(), t0 = performance.now();
        let inRun = null, hitEarly = false;
        const fnHit = (f) => {
          if (f.midi != null && Math.abs(P.devCents(f.midi, st.target)) <= 30) {
            if (inRun == null) inRun = f.t;
            if (f.t - inRun >= 700) hitEarly = true;
          } else inRun = null;
        };
        Mic.listeners.add(fnHit);
        await until(() => !alive() || hitEarly || performance.now() - t0 > 3200, 50);
        Mic.listeners.delete(fnHit);
        c.stop();
        if (!alive()) break;
        const v = c.frames.filter((f) => f.midi != null && f.t >= t0 + 350).map((f) => P.devCents(f.midi, st.target));
        let out;
        if (v.length < 6) out = { dev: null, cls: 'miss' };
        else {
          const d = hitEarly ? median(v.slice(-30)) : median(v), ad = Math.abs(d);
          out = { dev: d, cls: ad <= 30 ? 'hit' : ad <= 60 ? 'near' : 'miss' };
        }
        res.push(out);
        chips[i] = { cls: out.cls, txt: out.cls === 'miss' && out.dev == null ? '–' : P.noteBase(st.target) };
        paint();
        await sleep(300);
      }
      CT.Live.target = null;
      if (CT.Run.id !== rid) return;
      if (stopped) { idle(); return; }
      const hits = res.filter((r) => r.cls === 'hit').length, near = res.filter((r) => r.cls === 'near').length;
      const pct = (100 * hits) / list.length;
      const ads = res.filter((r) => r.dev != null).map((r) => Math.abs(r.dev));
      const key = kind === 'ear' ? 'earPct' : kind === 'pairs' ? 'pairsPct' : voice === 'main' ? 'scalePct' : 'thirdPct';
      const win = bestOf(key, pct, { label: 'acertos', unit: '%', dec: 0 });
      const type = kind === 'ear' ? 'ear' : voice === 'main' ? 'scale' : 'third';
      const ok = !spec.hits || pct >= spec.hits;
      const nm = kind === 'ear' ? 'Ouvido' : kind === 'pairs' ? 'Intervalos' : voice === 'main' ? 'Escala' : CT.VOICES[voice].name;
      present(ctx, spec, {
        pass: ok, need: 'Acertos ' + Math.round(pct) + '% (meta ' + spec.hits + '%).', score: Math.round(pct),
        type, data: { pct, hits, n: list.length, ad: avg(ads), voice },
        txt: nm + (kind === 'ear' ? '' : ' em ' + P.noteLabel(root)) + ': ' + hits + '/' + list.length + ' acertos, erro médio ' + Math.round(avg(ads)) + '¢',
        prompt: '<b class="mono big">' + hits + '/' + list.length + '</b> notas afinadas', win,
        html: '<div class="chips">' + chips.map((c, i) => '<span class="chip ' + c.cls + '">' + (kind === 'ear' ? P.noteBase(list[i].target) : c.txt) + '</span>').join('') + '</div>' +
          tiles([
            { l: 'Acertos', v: hits, u: '/' + list.length, n: near ? near + ' quase (até 60¢)' : 'dentro de 30¢' },
            { l: 'Erro médio', v: Math.round(avg(ads)), u: '¢', n: avg(ads) < 20 ? 'muito próximo' : avg(ads) < 40 ? 'bom caminho' : 'continue ouvindo e ajustando' }
          ]),
        extra: kind !== 'ear' && pct >= 78 ? [{ label: 'Subir meio-tom', fn: () => { root++; S.pref[keyBase] = root; CT.save(); idle(); } }] : []
      }, idle);
    }
    idle();
  }

  /* ---------- dinâmica (crescendo e diminuendo) ---------- */
  function dyn(spec, ctx) {
    const rid = shell('Dinâmica', 'Segure uma nota e faça: baixinho, forte no meio, baixinho de novo. Mesma nota, só o volume muda.', 'live', ctx);
    const alive = () => CT.Run.id === rid;
    const S = CT.S;
    const secs = spec.secs || 8;
    let target = CT.clampTarget(CT.defaultTarget());
    function idle() {
      CT.Live.target = target;
      X.prompt('Nota: <b class="mono big">' + P.noteLabel(target) + '</b><br><span class="fine">Duração ' + secs + ' s. Meta: subir ' + spec.rise + ' dB e voltar. Mantenha o celular sempre à mesma distância da boca.</span>');
      X.controls([
        { label: '‹ meio-tom', kind: 'sm', fn: () => { target = CT.clampTarget(target - 1); idle(); } },
        { label: 'Ouvir', kind: 'sm', fn: () => CT.playTone(target, 1.2) },
        { label: 'meio-tom ›', kind: 'sm', fn: () => { target = CT.clampTarget(target + 1); idle(); } },
        { label: 'Começar', kind: 'primary full', fn: run }
      ]);
      X.result('');
    }
    async function run() {
      if (!(await Mic.start())) return;
      X.result(''); X.controls([]);
      X.prompt('Ouça a nota…');
      await CT.playTone(target, 1.2);
      if (!alive()) return;
      X.prompt('Comece baixinho… <b>cresça</b>… e <b>volte</b>.');
      let stop = false;
      const c = collect(), t0 = performance.now();
      X.controls([{ label: 'Parar', kind: 'danger', fn: () => { stop = true; } }]);
      await until(() => {
        if (!alive() || stop) return true;
        const now = performance.now();
        if (c.firstS == null) return now - t0 > 8000;
        return now - c.lastS > 700 || now - c.firstS > (secs + 4) * 1000;
      });
      c.stop();
      if (!alive()) return;
      if (c.firstS == null) { X.prompt('Não ouvi.'); X.controls([{ label: 'Tentar de novo', kind: 'primary', fn: idle }]); return; }
      const dur = (c.lastS - c.firstS) / 1000;
      const bins = [];
      for (let b = 0; b < Math.floor(dur / 0.3); b++) {
        const fr = c.frames.filter((f) => f.sound && f.t >= c.firstS + b * 300 && f.t < c.firstS + (b + 1) * 300);
        if (fr.length) bins.push(20 * Math.log10(avg(fr.map((f) => f.rms))));
      }
      if (bins.length < 8) { X.prompt('Nota curta demais (' + fmt1(dur) + ' s). Segure pelo menos 3 s.'); X.controls([{ label: 'Tentar de novo', kind: 'primary', fn: idle }]); return; }
      const sm = bins.map((_, i) => avg(bins.slice(Math.max(0, i - 1), i + 2)));
      let pk = 0;
      sm.forEach((v, i) => { if (v > sm[pk]) pk = i; });
      const startDb = avg(sm.slice(0, 2)), endDb = avg(sm.slice(-2));
      const rise = sm[pk] - startDb, fall = sm[pk] - endDb;
      const pos = pk / (sm.length - 1);
      const devs = c.frames.filter((f) => f.midi != null).map((f) => P.devCents(f.midi, target));
      const inTune = devs.length ? (100 * devs.filter((d) => Math.abs(d) <= 40).length) / devs.length : 0;
      const okShape = rise >= (spec.rise || 5) && fall >= (spec.fall || 5) && pos >= 0.2 && pos <= 0.8;
      const ok = okShape && dur >= Math.min(secs - 2, 5);
      const need = [rise < (spec.rise || 5) ? 'subiu só ' + fmt1(rise) + ' dB (meta ' + spec.rise + ')' : '', fall < (spec.fall || 5) ? 'voltou só ' + fmt1(fall) + ' dB' : '',
        (pos < 0.2 || pos > 0.8) ? 'o pico deve ficar no meio da nota' : '', dur < Math.min(secs - 2, 5) ? 'segure ao menos ' + Math.min(secs - 2, 5) + ' s' : ''].filter(Boolean).join('; ');
      const win = bestOf('dynRise', rise, { label: 'amplitude de volume', unit: ' dB' });
      present(ctx, spec, {
        pass: ok, need: need ? need[0].toUpperCase() + need.slice(1) + '.' : '', score: Math.round(clamp((rise / (spec.rise || 5)) * 50 + (fall / (spec.fall || 5)) * 50, 0, 100)),
        type: 'dyn', data: { rise, fall, pos, inTune },
        txt: 'Dinâmica: subiu ' + fmt1(rise) + ' dB, voltou ' + fmt1(fall) + ' dB, pico em ' + Math.round(pos * 100) + '% da nota, ' + Math.round(inTune) + '% afinado',
        prompt: 'Subiu <b class="mono big">' + fmt1(rise) + ' dB</b>', win,
        html: '<div class="curve">' + CT.spark(sm) + '</div>' + tiles([
          { l: 'Subida', v: fmt1(rise), u: ' dB', n: 'meta ' + (spec.rise || 5) }, { l: 'Descida', v: fmt1(fall), u: ' dB', n: 'meta ' + (spec.fall || 5) },
          { l: 'Pico', v: Math.round(pos * 100), u: '%', n: 'da duração da nota' }, { l: 'Afinado', v: Math.round(inTune), u: '%', n: 'mantendo a nota' }
        ])
      }, idle);
    }
    idle();
  }

  /* ---------- ritmo ---------- */
  function rhythm(spec, ctx) {
    const rid = shell('Pulso', 'Cante "tá" curto a cada clique. Treina entrada no tempo certo.', 'none', ctx);
    const alive = () => CT.Run.id === rid;
    const bpm = spec.bpm || 80, N = spec.beats || 8;
    function idle() {
      X.prompt('Andamento <b>' + bpm + ' bpm</b>, ' + N + ' batidas depois de 4 de contagem.<br><span class="fine">Meta: ' + spec.pct + '% das batidas. Use fones para o clique não entrar no microfone.</span>');
      X.controls([{ label: 'Começar', kind: 'primary full', fn: run }]);
      X.result('');
    }
    async function run() {
      if (!(await Mic.start())) return;
      X.result(''); X.controls([]);
      const ac = Mic.ensureCtx(), beat = 60 / bpm;
      const t = ac.currentTime + 0.3;
      for (let i = 0; i < 4 + N; i++) CT.click(t + i * beat, i === 0 || i === 4);
      const perf0 = performance.now() + (t - ac.currentTime) * 1000 + (ac.outputLatency || 0.08) * 1000;
      const onsets = [];
      let lastSound = -1e9, wasSound = false;
      const fn = (f) => {
        if (f.sound && !wasSound && f.t - lastSound > 110) onsets.push((f.t - perf0) / 1000);
        if (f.sound) lastSound = f.t;
        wasSound = f.sound;
      };
      Mic.listeners.add(fn);
      let stop = false;
      X.controls([{ label: 'Parar', kind: 'danger', fn: () => { stop = true; } }]);
      const total = (4 + N) * beat + 0.6;
      const iv = setInterval(() => {
        const now = (performance.now() - perf0) / 1000;
        const k = Math.floor(now / beat);
        X.prompt(now < 0 ? 'Prepare-se…' : k < 4 ? 'Contagem <b class="mono big">' + (k + 1) + '</b>' : 'Cante "tá" <b class="mono big">' + (k - 3) + '/' + N + '</b>');
      }, 60);
      await until(() => !alive() || stop || (performance.now() - perf0) / 1000 > total, 50);
      clearInterval(iv);
      Mic.listeners.delete(fn);
      if (!alive()) return;
      if (stop) { idle(); return; }
      const used = new Set();
      const offs = [];
      let hits = 0;
      for (let i = 0; i < N; i++) {
        const bt = (4 + i) * beat;
        let bj = -1, bd = 0.18;
        onsets.forEach((o, j) => { if (!used.has(j) && Math.abs(o - bt) < bd) { bd = Math.abs(o - bt); bj = j; } });
        if (bj >= 0) { used.add(bj); hits++; offs.push((onsets[bj] - bt) * 1000); }
      }
      const pct = (100 * hits) / N;
      const mean = offs.length ? avg(offs) : 0;
      const win = bestOf('rhythmPct', pct, { label: 'pulso', unit: '%', dec: 0 });
      present(ctx, spec, {
        pass: pct >= (spec.pct || 60), need: 'Batidas no tempo: ' + Math.round(pct) + '% (meta ' + spec.pct + '%).', score: Math.round(pct),
        type: 'rhythm', data: { pct, bpm, mean },
        txt: 'Pulso ' + bpm + ' bpm: ' + hits + '/' + N + ' batidas, ' + (mean > 20 ? 'atrasado ' : mean < -20 ? 'adiantado ' : 'no tempo ') + Math.round(Math.abs(mean)) + ' ms',
        prompt: '<b class="mono big">' + hits + '/' + N + '</b> batidas', win,
        html: tiles([
          { l: 'No tempo', v: hits, u: '/' + N, n: 'dentro de ±180 ms' },
          { l: 'Tendência', v: Math.round(Math.abs(mean)), u: ' ms', n: mean > 25 ? 'entrando atrasado' : mean < -25 ? 'entrando adiantado' : 'centrado no pulso' }
        ]) + '<p class="fine">Detectei ' + onsets.length + ' entradas de som. Se foram muitas a mais, o som do clique pode estar entrando no microfone: use fones.</p>'
      }, idle);
    }
    idle();
  }

  /* ---------- vibrato ---------- */
  function vib(spec, ctx) {
    const rid = shell('Vibrato', 'Segure uma nota e deixe a oscilação natural aparecer. O app mede velocidade e amplitude.', 'live', ctx);
    const alive = () => CT.Run.id === rid;
    let target = CT.clampTarget(CT.defaultTarget());
    function idle() {
      CT.Live.target = target;
      X.prompt('Nota: <b class="mono big">' + P.noteLabel(target) + '</b><br><span class="fine">Segure ' + (spec.dur || 4) + ' s. Sem forçar: relaxe a mandíbula e mantenha o ar constante.</span>');
      X.controls([
        { label: '‹ meio-tom', kind: 'sm', fn: () => { target = CT.clampTarget(target - 1); idle(); } },
        { label: 'Ouvir', kind: 'sm', fn: () => CT.playTone(target, 1.2) },
        { label: 'meio-tom ›', kind: 'sm', fn: () => { target = CT.clampTarget(target + 1); idle(); } },
        { label: 'Começar', kind: 'primary full', fn: run }
      ]);
      X.result('');
    }
    async function run() {
      if (!(await Mic.start())) return;
      X.result(''); X.controls([]); X.prompt('Ouça a nota…');
      await CT.playTone(target, 1.2);
      if (!alive()) return;
      X.prompt('Segure a nota e deixe oscilar.');
      let stop = false;
      const c = collect(), t0 = performance.now();
      X.controls([{ label: 'Parar', kind: 'danger', fn: () => { stop = true; } }]);
      await until(() => {
        if (!alive() || stop) return true;
        const now = performance.now();
        if (c.firstT == null) return now - t0 > 8000;
        return now - c.lastT > 700 || now - c.firstT > 10000;
      });
      c.stop();
      if (!alive()) return;
      const fr = c.frames.filter((f) => f.raw != null && f.t >= (c.firstT || 0) + 600 && f.t <= (c.lastT || 0));
      const dur = c.firstT != null ? (c.lastT - c.firstT) / 1000 : 0;
      if (fr.length < 40) { X.prompt('Nota curta demais para medir. Segure ao menos 3 s.'); X.controls([{ label: 'Tentar de novo', kind: 'primary', fn: idle }]); return; }
      const ps = fr.map((f) => f.raw);
      const det = ps.map((v, i) => v - avg(ps.slice(Math.max(0, i - 8), i + 9)));
      let cross = 0;
      const times = [];
      for (let i = 1; i < det.length; i++) if (det[i - 1] < 0 && det[i] >= 0) { cross++; times.push(fr[i].t); }
      const span = (fr[fr.length - 1].t - fr[0].t) / 1000;
      const rate = span > 0 ? cross / span : 0;
      const extent = avg(det.map(Math.abs)) * (Math.PI / 2) * 100;
      let reg = 0;
      if (times.length > 3) {
        const iv = times.slice(1).map((t, i) => t - times[i]);
        reg = Math.max(0, 100 - (stdev(iv) / avg(iv)) * 100);
      }
      const present0 = extent >= 15 && rate >= 4.5 && rate <= 7.5;
      const label = extent < 15 ? 'nota reta, sem vibrato' : rate < 4.5 ? 'oscilação lenta (balanço)' : rate > 7.5 ? 'oscilação rápida (trêmulo)' : 'vibrato natural';
      present(ctx, spec, {
        pass: present0 && dur >= (spec.dur || 3), need: 'Resultado: ' + label + '. Procure 4,5 a 7,5 oscilações por segundo e amplitude acima de 15¢.',
        score: present0 ? 100 : 40, type: 'vib', data: { rate, extent, reg },
        txt: 'Vibrato: ' + fmt1(rate) + ' Hz, amplitude ±' + Math.round(extent) + '¢, ' + label,
        prompt: 'Resultado: <b>' + label + '</b>',
        html: tiles([
          { l: 'Velocidade', v: fmt1(rate), u: ' Hz', n: 'ideal 4,5 a 7,5' }, { l: 'Amplitude', v: '±' + Math.round(extent), u: '¢', n: 'ideal 15 a 100' },
          { l: 'Regularidade', v: Math.round(reg), u: '%', n: reg > 60 ? 'bem regular' : 'irregular' }
        ]) + '<p class="fine">Vibrato nasce de relaxamento e apoio, não de forçar. Se ficou reto, deixe a mandíbula solta e prolongue o final da nota. Se ficou rápido demais, é tensão: relaxe e diminua o volume.</p>'
      }, idle);
    }
    idle();
  }

  /* ---------- melodia (música inteira, voz principal ou segunda voz) ---------- */
  function melody(spec, ctx) {
    const song = CT.SONGS[spec.song];
    const rid = shell(song.name, song.style + ' · ' + song.level, 'roll', ctx);
    let stopped = false;
    const alive = () => CT.Run.id === rid && !stopped;
    const S = CT.S;
    const free = ctx.mode === 'free';
    let voice = spec.voice || 'main', guide = spec.guide || 'melody', tempo = 1, tonic = 0;
    const pitched = song.notes.filter((n) => n[0] != null);
    const keyPref = () => 'mel_' + spec.song + '_' + voice;
    const isG = spec.inst === 'g';
    const verb = isG ? 'Toque' : 'Cante';
    function setTonic() {
      const saved = S.pref[keyPref()];
      tonic = saved != null ? saved : isG ? (spec.tonic != null ? spec.tonic : 55) : CT.fitTonic(pitched.map((n) => n[0] + CT.VOICES[voice].shift));
    }
    const hint = (m) => (isG && CT.fretText ? ' <span class="fine">' + CT.fretText(m) + '</span>' : '');
    function build() {
      const beat = 60 / (song.bpm * tempo), sh = CT.VOICES[voice].shift;
      let t = 0;
      return song.notes.map((n) => {
        const t0 = t; t += n[1] * beat;
        return { t0, t1: t, rest: n[0] == null, melody: n[0] == null ? null : CT.degMidi(tonic, n[0]), target: n[0] == null ? null : CT.degMidi(tonic, n[0] + sh) };
      });
    }
    const vName = () => CT.VOICES[voice].name;
    function idle() {
      stopped = false;
      setTonic();
      const notes = build();
      const ts = notes.filter((n) => !n.rest).map((n) => n.target);
      const center = (Math.min(...ts) + Math.max(...ts)) / 2;
      CT.Roll.set(notes, center, voice !== 'main');
      CT.Roll.draw(-0.6);
      const gName = { melody: 'Guia: melodia', target: 'Guia: sua nota', off: 'Sem guia' }[guide];
      X.prompt('<b>' + vName() + '</b> · tom inicial <span class="mono">' + P.noteLabel(notes.find((n) => !n.rest).target) + '</span>' +
        '<br><span class="fine">' + esc(song.lyrics) + '</span>' +
        (spec.score ? '<br><span class="fine">Meta: ' + spec.score + '% de acerto.</span>' : ''));
      const b = [];
      b.push({ label: 'Ver demonstração', kind: 'sm', fn: () => demo() });
      b.push({ label: 'Ouvir sua linha', kind: 'sm', fn: () => preview(false) });
      if (voice !== 'main') b.push({ label: 'Ouvir as duas', kind: 'sm', fn: () => preview(true) });
      b.push({ label: '‹ meio-tom', kind: 'sm', fn: () => { S.pref[keyPref()] = tonic - 1; CT.save(); idle(); } });
      b.push({ label: 'meio-tom ›', kind: 'sm', fn: () => { S.pref[keyPref()] = tonic + 1; CT.save(); idle(); } });
      if (free) {
        b.push({ label: gName, kind: 'sm', fn: () => { guide = guide === 'melody' ? 'target' : guide === 'target' ? 'off' : 'melody'; idle(); } });
        b.push({ label: 'Andamento ' + Math.round(tempo * 100) + '%', kind: 'sm', fn: () => { tempo = tempo === 1 ? 0.75 : tempo === 0.75 ? 1.15 : 1; idle(); } });
        b.push({ label: 'Voz: ' + (voice === 'main' ? 'principal' : voice === 'third' ? 'terça acima' : voice === 'thirdDown' ? 'terça abaixo' : 'quinta'), kind: 'sm', fn: () => {
          const order = ['main', 'third', 'thirdDown', 'fifth'];
          voice = order[(order.indexOf(voice) + 1) % order.length];
          idle();
        } });
      }
      b.push({ label: 'Começar', kind: 'primary full', fn: run });
      X.controls(b);
      X.result('<p class="fine">Use fones. A linha branca é o "agora". Cante cada bloco quando ele encosta nela.</p>');
    }
    /* Demonstração: o app "canta" a linha na pista, com o ponto do cantor ideal. */
    function demo() {
      CT.stopTones();
      if (demoIv) clearInterval(demoIv);
      setTonic();
      const notes = build();
      const ts = notes.filter((n) => !n.rest).map((n) => n.target);
      CT.Roll.set(notes, (Math.min(...ts) + Math.max(...ts)) / 2, voice !== 'main');
      const ac = Mic.ensureCtx(), t = ac.currentTime + 0.4;
      notes.forEach((n) => {
        if (n.rest) return;
        const d = Math.max(0.08, (n.t1 - n.t0) * 0.94);
        CT.tone(n.target, t + n.t0, d, 0.2);
        if (voice !== 'main') CT.tone(n.melody, t + n.t0, d, 0.1, 'sine');
      });
      const p0 = performance.now() + 400, total = notes[notes.length - 1].t1;
      X.prompt('<b>Demonstração</b>: ' + (voice === 'main' ? 'esta é a linha que você ' + (isG ? 'toca' : 'canta') : 'a sua linha toca forte e a melodia fica por baixo') + '. Acompanhe o ponto branco.');
      demoIv = setInterval(() => {
        if (CT.Run.id !== rid) { clearInterval(demoIv); return; }
        const now = (performance.now() - p0) / 1000;
        const an = notes.find((n) => !n.rest && now >= n.t0 && now < n.t1);
        CT.Roll.push(now, an ? an.target : null, an ? an.target : null);
        CT.Roll.draw(now);
        if (now > total + 0.4) { clearInterval(demoIv); CT.Roll.set(notes, (Math.min(...ts) + Math.max(...ts)) / 2, voice !== 'main'); CT.Roll.draw(-0.6); idle(); }
      }, 33);
    }
    let demoIv = 0;
    CT.melodyDemo = demo;
    CT.onCleanup(() => { clearInterval(demoIv); CT.melodyDemo = null; });
    function preview(both) {
      CT.stopTones();
      const ac = Mic.ensureCtx(), t = ac.currentTime + 0.1, notes = build();
      notes.forEach((n) => {
        if (n.rest) return;
        const d = Math.max(0.08, (n.t1 - n.t0) * 0.94);
        CT.tone(n.target, t + n.t0, d, 0.2);
        if (both) CT.tone(n.melody, t + n.t0, d, 0.13, 'sine');
      });
    }
    async function run() {
      CT.stopTones();
      if (!(await Mic.start())) return;
      setTonic();
      const notes = build();
      const ts = notes.filter((n) => !n.rest).map((n) => n.target);
      CT.Roll.set(notes, (Math.min(...ts) + Math.max(...ts)) / 2, voice !== 'main');
      const ac = Mic.ensureCtx(), beat = 60 / (song.bpm * tempo);
      let t = ac.currentTime + 0.15;
      CT.tone(notes.find((n) => !n.rest).target, t, 1.0, 0.24);
      t += 1.5;
      for (let i = 0; i < 4; i++) CT.click(t + i * beat, i === 0);
      const t0ctx = t + 4 * beat;
      if (guide !== 'off') {
        notes.forEach((n) => {
          if (n.rest) return;
          CT.tone(guide === 'target' ? n.target : n.melody, t0ctx + n.t0, Math.max(0.08, (n.t1 - n.t0) * 0.94), 0.15);
        });
      }
      const perf0 = performance.now() + (t0ctx - ac.currentTime) * 1000;
      const total = notes[notes.length - 1].t1;
      const frames = [];
      const activeAt = (tt) => notes.find((n) => !n.rest && tt >= n.t0 - 0.08 && tt < n.t1 + 0.12);
      const fn = (f) => {
        const tt = (f.t - perf0) / 1000;
        frames.push({ t: tt, midi: f.midi, sound: f.sound });
        const an = activeAt(tt);
        CT.Roll.push(tt, f.midi, an ? an.target : null);
      };
      Mic.listeners.add(fn);
      X.result('');
      X.prompt('Ouça a nota inicial…');
      X.controls([{ label: 'Parar', kind: 'danger', fn: () => { stopped = true; CT.stopTones(); } }]);
      const scoreNote = (n) => {
        const a = n.t0 + 0.12, b = n.t1 + 0.08, len = Math.max(0.12, b - a);
        const fr = frames.filter((f) => f.t >= a && f.t <= b);
        const exp = Math.max(2, (len / 0.025) * 0.7);
        const voiced = fr.filter((f) => f.midi != null);
        const good = voiced.filter((f) => Math.abs(P.devCents(f.midi, n.target)) <= 40).length;
        return { pct: clamp(good / exp, 0, 1), voiced: voiced.length, devs: voiced.map((f) => P.devCents(f.midi, n.target)) };
      };
      let lastP = '';
      const iv = setInterval(() => {
        const now = (performance.now() - perf0) / 1000;
        notes.forEach((n) => {
          if (!n.rest && !n.res && now > n.t1 + 0.12) {
            const s = scoreNote(n);
            n.sc = s;
            n.res = s.pct >= 0.7 ? 'hit' : s.pct >= 0.4 ? 'near' : 'miss';
          }
        });
        let ptxt;
        if (now < 0) ptxt = now < -4 * beat ? 'Ouça a nota inicial…' : 'Contagem: <b class="mono big">' + Math.min(4, Math.floor((now + 4 * beat) / beat) + 1) + '</b>';
        else { const an = activeAt(now); ptxt = an ? verb + ' <b class="mono big">' + P.noteBase(an.target) + '</b>' + hint(an.target) : '…'; }
        if (ptxt !== lastP) { X.prompt(ptxt); lastP = ptxt; }
        CT.Roll.draw(now);
      }, 33);
      await until(() => !alive() || (performance.now() - perf0) / 1000 > total + 0.5, 60);
      clearInterval(iv);
      Mic.listeners.delete(fn);
      CT.stopTones();
      if (CT.Run.id !== rid) return;
      if (stopped) { idle(); return; }
      notes.forEach((n) => { if (!n.rest && !n.sc) { n.sc = scoreNote(n); n.res = n.sc.pct >= 0.7 ? 'hit' : n.sc.pct >= 0.4 ? 'near' : 'miss'; } });
      const real = notes.filter((n) => !n.rest);
      const totalDur = real.reduce((s, n) => s + (n.t1 - n.t0), 0);
      const score = Math.round((100 * real.reduce((s, n) => s + n.sc.pct * (n.t1 - n.t0), 0)) / totalDur);
      const hits = real.filter((n) => n.res === 'hit').length;
      const silent = real.filter((n) => n.sc.voiced < 2).length;
      const devs = [].concat(...real.map((n) => n.sc.devs));
      const mean = devs.length ? median(devs) : 0;
      const key = 'mel_' + spec.song + '_' + voice;
      const win = bestOf(key, score, { label: 'pontuação em "' + song.name + '"', unit: '%', dec: 0 });
      const tip = [];
      if (silent > real.length * 0.25) tip.push('Em ' + silent + ' notas eu não ouvi voz. Respire antes das frases e cante a sílaba inteira.');
      if (mean > 15) tip.push('Você tende a ficar acima da nota (+' + Math.round(mean) + '¢). Relaxe a garganta e abaixe o queixo.');
      if (mean < -15) tip.push('Você tende a ficar abaixo da nota (' + Math.round(mean) + '¢). Mantenha o apoio e pense a nota um pouco mais alta.');

      $$('.stars').forEach((g) => $$('button', g).forEach((b) => {
        b.onclick = () => {

    if (c < 55) return 'voz média-grave (tipo barítono)';
    if (c < 60) return 'voz média (tipo tenor ou contralto)';
    if (c < 65) return 'voz média-aguda (tipo tenor agudo ou mezzo)';
    return 'voz aguda (tipo soprano)';
  };
})();

  /* ---------- acordes parados ---------- */
  function gchord(spec, ctx) {

      X.result('<div class="chordrow">' + list.slice(0, 3).map(CT.chordSVG).join('') + '</div>');

        pass: !spec.hits || pct >= spec.hits, need: 'Acordes reconhecidos: ' + Math.round(pct) + '% (meta ' + spec.hits + '%).', score: Math.round(pct),
        type: 'gchord', data: { pct, hits, n: list.length },
        txt: 'Acordes ' + list.join(' ') + ': ' + hits + '/' + list.length, prompt: '<b class="mono big">' + hits + '/' + list.length + '</b> acordes', win,
        html: '<div class="chips">' + list.map((c, i) => '<span class="chip ' + (res[i] || 'miss') + '">' + esc(c) + '</span>').join('') + '</div>' +
          '<p class="fine">Se o acorde não for reconhecido, toque as cordas uma a uma para achar a que está abafada. O app precisa ouvir as cordas todas.</p>'
      }, idle);
    }
    idle();
  }

  /* ---------- troca de acordes no tempo ---------- */
  function gseq(spec, ctx) {
    const rid = CT.shell('Troca de acordes', 'Troque de acorde no primeiro tempo de cada compasso, no ritmo do clique.', 'none', ctx);
    let stopped = false;
    const alive = () => CT.Run.id === rid && !stopped;
    const bpm = spec.bpm || 60, bpc = spec.beats || 4, rounds = spec.rounds || 1;
    const bars = [];
    for (let r = 0; r < rounds; r++) spec.chords.forEach((c) => bars.push(c));
    function idle() {
      stopped = false;

      for (let i = 0; i < countIn + bars.length * bpc; i++) CT.click(t + i * beat, i === 0 || (i >= countIn && (i - countIn) % bpc === 0));
      const perf0 = performance.now() + (t - ac.currentTime) * 1000;

      const iv = setInterval(() => {
        const now = (performance.now() - perf0) / 1000;

        if (pos < countIn) {

          if (!$('#cur')) X.result('<div id="cur" class="chordrow">' + CT.chordSVG(bars[0]) + '</div>');
          return;
        }
        const bi = Math.floor((pos - countIn) / bpc);
        if (bi >= bars.length) return;
        X.prompt('Acorde <b class="mono big">' + esc(bars[bi]) + '</b>' + (bars[bi + 1] ? ' → ' + esc(bars[bi + 1]) : '') + ' <span class="fine">compasso ' + (bi + 1) + '/' + bars.length + '</span>');
        const cur = $('#cur');

          '<p class="fine">Se errou muito, baixe o andamento 10 bpm e aumente aos poucos. Troca limpa vale mais que troca rápida.</p>'

    function idle() {
      stopped = false;

    }

    }

  /* ---------- curso ---------- */
  SCREENS.course = () => {

    let h = '<button class="back" id="mback">‹ Curso</button><div class="mh"><span class="pill ' + TRACKS()[m.track].cls + '">' + TRACKS()[m.track].name + '</span><span class="fine">Nível ' + m.level + ' · módulo ' + (i + 1) + '</span></div>' +

        (p ? ' · melhor ' + p.score : '') + '</span></div><button class="btn sm ' + (locked ? '' : 'primary') + '" data-t="' + t.id + '"' + (locked ? ' disabled' : '') + '>' + (p ? 'Repetir' : 'Fazer') + '</button></li>';

  CT.openModule = openModule;

  /* ---------- minhas músicas (guardadas só no aparelho) ---------- */
  const NAMEPC = { do: 0, 'dó': 0, c: 0, re: 2, 'ré': 2, d: 2, mi: 4, e: 4, fa: 5, 'fá': 5, f: 5, sol: 7, g: 7, la: 9, 'lá': 9, a: 9, si: 11, b: 11 };
  const KEYS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function parseMelody(text, key) {
    const keyPc = KEYS[key] != null ? KEYS[key] : 0, out = [], bad = [];
    text.split(/[\s|]+/).filter(Boolean).forEach((tok) => {
      if (/^[RrPp](:[\d.,]+)?$/.test(tok)) { out.push([null, parseFloat((tok.split(':')[1] || '1').replace(',', '.')) || 1]); return; }
      const m = /^([A-Za-zÀ-ÿ]+)(#|b)?([+\-]*)(?::([\d.,]+))?$/.exec(tok);
      const base = m ? NAMEPC[m[1].toLowerCase()] : undefined;
      if (!m || base == null) { bad.push(tok); return; }
      const pc = (base + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12;
      const rel = (pc - keyPc + 12) % 12;
      let idx = 0;
      CT.MAJ.forEach((v, i) => { if (v <= rel) idx = i; });
      const oct = (m[3].match(/\+/g) || []).length - (m[3].match(/-/g) || []).length;
      out.push([idx + 7 * oct, parseFloat((m[4] || '1').replace(',', '.')) || 1]);
    });
    return { notes: out, bad };
  }
  function registerMySongs() {
    const my = S().my || { voz: [], violao: [] };
    Object.keys(CT.SONGS).filter((k) => /^my_/.test(k)).forEach((k) => delete CT.SONGS[k]);
    my.voz.forEach((s) => {
      const p = parseMelody(s.text, s.key);
      if (p.notes.length) CT.SONGS['my_' + s.id] = { name: s.name, style: 'Minha música', bpm: s.bpm || 90, level: 'Sua', lyrics: s.lyrics || 'Melodia que você cadastrou.', notes: p.notes, mine: true };
    });
  }
  CT.registerMySongs = registerMySongs;
