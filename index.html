        ['Aquecimento rápido', '4 minutos, 6 etapas.', { kind: 'warmup', routine: 'quick' }],
        ['Aquecimento completo', '9 minutos, 9 etapas.', { kind: 'warmup', routine: 'full' }],
        ['Desaquecimento', '3 minutos para fechar o treino.', { kind: 'warmup', routine: 'cool' }]
      ]],
      ['Voz e fôlego', [
        ['Teste de voz', 'Sua extensão e zona confortável.', { kind: 'range' }],
        ['Sirene', 'Deslizar do grave ao agudo sem quebrar.', { kind: 'glide', semis: 'auto', cont: 0.6 }],
        ['Tempo de fôlego', 'Quantos segundos você sustenta.', { kind: 'mpt' }],
        ['Respiração guiada', 'Inspire, segure e solte em "sss".', { kind: 'breath' }]
      ]],
      ['Afinação e ouvido', [
        ['Sustentar a nota', 'Duração, afinação e estabilidade.', { kind: 'hold' }],
        ['Escala guiada', 'Cinco notas, subindo e descendo.', { kind: 'steps', pattern: 'scale5', voice: 'main', guide: 'melody' }],
        ['Saltos', 'Terças e quartas.', { kind: 'steps', pattern: 'skips', voice: 'main', guide: 'melody' }],
        ['Arpejo', 'Tônica, terça, quinta e oitava.', { kind: 'steps', pattern: 'arp', voice: 'main', guide: 'melody' }],
        ['Acertar de ouvido', 'Seis notas sem ver o nome.', { kind: 'ear', n: 6 }],
        ['Intervalos', 'Ouvir uma nota e cantar outra.', { kind: 'pairs', pairs: [[0, 2], [0, 4], [0, 7], [2, 4], [3, 7], [4, 0]] }]
      ]],
      ['Segunda voz', [
        ['Terça acima', 'Escala em terças, melodia tocando.', { kind: 'steps', pattern: 'scale5', voice: 'third', guide: 'melody' }],
        ['Terça abaixo', 'A segunda voz mais cheia.', { kind: 'steps', pattern: 'scale5', voice: 'thirdDown', guide: 'melody' }],
        ['Quinta acima', 'Harmonia aberta, estilo gospel.', { kind: 'steps', pattern: 'scale5', voice: 'fifth', guide: 'melody' }],
        ['Saltos em terças', 'Segunda voz em saltos.', { kind: 'steps', pattern: 'skips', voice: 'third', guide: 'melody' }]
      ]],
      ['Técnica', [
        ['Dinâmica', 'Crescer e diminuir o volume.', { kind: 'dyn', secs: 8, rise: 5, fall: 5 }],
        ['Pulso', 'Entrar no tempo do clique.', { kind: 'rhythm', bpm: 80, beats: 12, pct: 60 }],
        ['Vibrato', 'Mede velocidade e amplitude.', { kind: 'vib', dur: 3 }]
      ]],
      ['Autoavaliação', [['Gravar e ouvir', 'Escute e avalie soltura, ar e som.', { kind: 'rec' }]]]
    ];
  }

  SCREENS.train = () => {
    const g = isG(), b = S().bests, secs = trainSections();
    let h = modeSwitch() + '<h1>Treinar</h1><p class="sub">Exercícios livres, sem meta nem bloqueio. Cada um tem tutorial e demonstração.</p>';
    secs.forEach((sec, si) => {
      h += '<h2 class="sec">' + sec[0] + '</h2><div class="list">';
      sec[1].forEach((it, ii) => { h += '<button class="exitem" data-s="' + si + '" data-i="' + ii + '"><b>' + it[0] + '</b><span>' + it[1] + '</span></button>'; });
      h += '</div>';
    });
    h += '<h2 class="sec">' + (g ? 'Melodias no violão' : 'Músicas') + '</h2><p class="fine">Escolha a voz e o guia na tela da música. A melhor pontuação aparece abaixo.</p><div class="list">';
    Object.keys(CT.SONGS).forEach((k) => {
      const sg = CT.SONGS[k];
      if (g && k.startsWith('my_')) return;
      if (!g && k === 'ponteado') return;
      const best = ['main', 'third', 'thirdDown', 'fifth'].map((v) => ({ v, s: b['mel_' + k + '_' + v] })).filter((x) => x.s != null);
      h += '<button class="exitem song" data-song="' + k + '"><b>' + esc(sg.name) + '</b><span>' + esc(sg.style) + ' · ' + sg.level + ' · ' + sg.bpm + ' bpm</span>' +
        (best.length ? '<em>' + best.map((x) => (x.v === 'main' ? 'Principal' : x.v === 'third' ? 'Terça' : x.v === 'thirdDown' ? 'Terça abaixo' : 'Quinta') + ' ' + x.s + '%').join(' · ') + '</em>' : '') + '</button>';
    });
    h += '</div><h2 class="sec">Seu repertório</h2><div class="list"><button class="exitem" id="mys"><b>Minhas músicas</b><span>' +
      (g ? 'Cadastre as cifras das músicas que quer aprender e treine a sequência de acordes no tempo.' : 'Cadastre melodias de músicas que você quer cantar. Ficam só neste aparelho.') + '</span></button></div>';
    h += '<h2 class="sec">Biblioteca</h2><div class="list"><button class="exitem" id="lib"><b>Técnicas e dicas</b><span>' + (g ? 'Postura, afinação, acordes, batida, pestana, dedilhado e cuidados.' : 'Postura, respiração, registros, segunda voz, estilo, palco e cuidados.') + '</span></button></div>';
    view.innerHTML = h;
    bindMode();
    $$('[data-s]').forEach((el) => { el.onclick = () => runFree(secs[+el.dataset.s][1][+el.dataset.i][2], 'train'); });
    $$('[data-song]').forEach((el) => {
      el.onclick = () => runFree(g ? { kind: 'melody', inst: 'g', song: el.dataset.song, voice: 'main', guide: 'melody', tonic: 55 } : { kind: 'melody', song: el.dataset.song, voice: 'main', guide: 'melody' }, 'train');
    });
    $('#mys').onclick = showMySongs;
    $('#lib').onclick = () => lessonsView('Técnicas e dicas', g ? CT.GLIB : CT.LIB);
  };

  /* ---------- afinador ---------- */
  SCREENS.tuner = () => {
    const g = isG();
    let h = modeSwitch() + '<h1>' + (g ? 'Afinador do violão' : 'Afinador de voz') + '</h1><p class="sub">' +
      (g ? 'Toque uma corda solta e veja se está alta ou baixa. Escolha a corda ou deixe no automático.' : 'Cante qualquer nota e veja em tempo real onde você está.') + '</p>' + CT.liveHTML();
    if (g) {
      h += '<div class="chips" id="strs"><button class="chip near" data-s="0">Auto</button>' +
        [6, 5, 4, 3, 2, 1].map((s) => '<button class="chip" data-s="' + s + '">' + s + ' · ' + CT.G_NAMES[s] + '</button>').join('') + '</div>';
    }
    h += '<div class="controls"><button class="btn primary" id="tunerBtn">Ligar microfone</button></div><p id="prompt" class="prompt"></p>';
    view.innerHTML = h;
    bindMode();
    CT.Live.mount();
    let on = false;
    $('#tunerBtn').onclick = async function () {
      if (on) { CT.Mic.stop(); on = false; this.textContent = 'Ligar microfone'; return; }
      if (await CT.Mic.start()) { on = true; this.textContent = 'Desligar'; }
    };
    $$('#strs .chip').forEach((c) => {
      c.onclick = () => {
        $$('#strs .chip').forEach((x) => x.classList.toggle('near', x === c));
        const s = +c.dataset.s;
        CT.Live.target = s ? CT.G_OPEN[s] : null;
        if (s) CT.playTone(CT.G_OPEN[s], 1.1);
      };
    });
  };

  /* ---------- progresso ---------- */
  const TYPES_V = { sustain: ['Sustentar', (h) => h.score, ' pts'], mpt: ['Fôlego', (h) => h.dur, ' s'], breath: ['Respiração', (h) => h.pct, '%'], scale: ['Escala', (h) => h.pct, '%'],
    third: ['Segunda voz', (h) => h.pct, '%'], ear: ['Ouvido', (h) => h.pct, '%'], rec: ['Autoavaliação', (h) => h.score, '%'], glide: ['Sirene', (h) => h.cover, ' st'],
    dyn: ['Dinâmica', (h) => h.rise, ' dB'], rhythm: ['Pulso', (h) => h.pct, '%'], melody: ['Músicas', (h) => h.score, '%'] };
  const TYPES_G = { gtune: ['Afinação', (h) => h.n * 100 / 6, '%'], gnotes: ['Notas no braço', (h) => h.pct, '%'], gchord: ['Acordes', (h) => h.pct, '%'],
    gseq: ['Troca de acordes', (h) => h.pct, '%'], gstrum: ['Batida', (h) => h.pct, '%'], gmelody: ['Melodias', (h) => h.score, '%'] };

  function reportText() {
    const st = S(), g = isG(), pl = PLACE();
    const L = ['Relatório de ' + (g ? 'violão' : 'canto') + ' · ' + new Date().toLocaleDateString('pt-BR')];
    if (!g && st.range) L.push('Extensão: ' + P.noteLabel(st.range.low) + ' a ' + P.noteLabel(st.range.high) + ' (' + (st.range.high - st.range.low) + ' semitons)');
    if (pl) L.push('Avaliação de nível (' + new Date(pl.t).toLocaleDateString('pt-BR') + '): ' + (g ? 'acompanhamento ' : 'voz principal ') + Math.round(pl.A) + ', ' + (g ? 'melodia e solo ' : 'segunda voz ') + Math.round(pl.B) + '. ' + pl.skills.map((s) => s.l + ' ' + Math.round(s.v)).join('; '));
    const cp = courseProgress();
    L.push('Curso: ' + cp.done + '/' + cp.total + ' módulos. ' + MODS().filter(modFinished).map((m) => m.title).join(', '));
    const b = st.bests, bl = [];
    if (g) {
      if (b.gchord != null) bl.push('acordes ' + Math.round(b.gchord) + '%');
      if (b.gseq != null) bl.push('trocas ' + Math.round(b.gseq) + '%');
      if (b.gstrum != null) bl.push('batida ' + Math.round(b.gstrum) + '%');
    } else {
      if (b.mpt != null) bl.push('fôlego ' + fmt1(b.mpt) + ' s');
      if (b.sustainDur != null) bl.push('nota sustentada ' + fmt1(b.sustainDur) + ' s');
      if (b.sustainStd != null) bl.push('oscilação mínima ±' + Math.round(b.sustainStd) + '¢');
      if (b.scalePct != null) bl.push('escala ' + Math.round(b.scalePct) + '%');
      if (b.thirdPct != null) bl.push('segunda voz ' + Math.round(b.thirdPct) + '%');
      if (b.earPct != null) bl.push('ouvido ' + Math.round(b.earPct) + '%');
    }
    if (bl.length) L.push('Recordes: ' + bl.join('; '));
    const hs = st.history.filter((x) => (g ? /^g/.test(x.type) || x.type === 'warmup' : !/^g/.test(x.type)));
    L.push('Sessões registradas: ' + hs.length + ' · dias seguidos: ' + CT.calcStreak());
    L.push('Últimas sessões:');
    hs.slice(-16).forEach((h) => L.push('- ' + new Date(h.t).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + h.txt));
    return L.join('\n');
  }

  SCREENS.prog = () => {
    const st = S(), b = st.bests, g = isG(), pl = PLACE();
    const rec = g ? [
      ['Acordes', b.gchord != null ? Math.round(b.gchord) + '%' : '–'], ['Trocas', b.gseq != null ? Math.round(b.gseq) + '%' : '–'],
      ['Batida', b.gstrum != null ? Math.round(b.gstrum) + '%' : '–'], ['Dias seguidos', CT.calcStreak() + '']
    ] : [
      ['Extensão', b.span != null ? b.span + ' st' : '–'], ['Fôlego', b.mpt != null ? fmt1(b.mpt) + ' s' : '–'],
      ['Nota sustentada', b.sustainDur != null ? fmt1(b.sustainDur) + ' s' : '–'], ['Menor oscilação', b.sustainStd != null ? '±' + Math.round(b.sustainStd) + '¢' : '–'],
      ['Escala', b.scalePct != null ? Math.round(b.scalePct) + '%' : '–'], ['Segunda voz', b.thirdPct != null ? Math.round(b.thirdPct) + '%' : '–'],
      ['Ouvido', b.earPct != null ? Math.round(b.earPct) + '%' : '–'], ['Dias seguidos', CT.calcStreak() + '']
    ];
    let h = modeSwitch() + '<h1>Progresso</h1><p class="sub">Cada número vem de uma medição do app. Recorde novo vira comemoração.</p>';
    if (pl) h += '<section class="card"><p class="eyebrow">Avaliação de nível · ' + new Date(pl.t).toLocaleDateString('pt-BR') + '</p>' + bars(pl.skills) + '</section>';
    h += '<div class="recs">' + rec.map((r) => '<div class="rec"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join('') + '</div>';
    h += '<h2 class="sec">Evolução</h2><div class="sparks">';
    let any = false;
    const T = g ? TYPES_G : TYPES_V;
    Object.keys(T).forEach((t) => {
      const hs = st.history.filter((x) => x.type === t).slice(-14);
      if (!hs.length) return;
      any = true;
      const vals = hs.map(T[t][1]);
      const lastV = vals[vals.length - 1], delta = vals.length > 1 ? lastV - vals[0] : 0;
      h += '<div class="sp-row"><div><b>' + T[t][0] + '</b><span>' + hs.length + ' sessões · último ' + (t === 'mpt' || t === 'dyn' ? fmt1(lastV) : Math.round(lastV)) + T[t][2] + '</span></div>' +
        CT.spark(vals) + '<em class="' + (delta > 0 ? 'up' : delta < 0 ? 'dn' : '') + '">' + (vals.length > 1 ? (delta > 0 ? '▲' : delta < 0 ? '▼' : '=') : '') + '</em></div>';
    });
    if (!any) h += '<p class="fine">Sem sessões ainda. Faça um exercício e volte aqui.</p>';
    const hs = st.history.filter((x) => (g ? /^g/.test(x.type) || x.type === 'warmup' : !/^g/.test(x.type)));
    h += '</div><h2 class="sec">Últimas sessões</h2><ul class="hist">' + hs.slice(-8).reverse().map((x) =>
      '<li><span>' + new Date(x.t).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + '</span>' + esc(x.txt || '') + '</li>').join('') + '</ul>';
    h += '<div class="card"><b>Análise mais funda</b><p class="fine">Copie o relatório e cole na conversa com o Claudio para uma leitura da sua evolução e um plano da próxima semana.</p><button class="btn primary" id="copyRep">Copiar relatório</button><textarea id="repTxt" rows="6" hidden></textarea></div>';
    h += '<button class="btn ghost danger" id="wipe">Apagar meus dados</button>';
    view.innerHTML = h;
    bindMode();
    $('#copyRep').onclick = () => {
      const t = reportText(), ta = $('#repTxt');
      const fb = () => { ta.hidden = false; ta.value = t; ta.select(); CT.toast('Selecione e copie o texto abaixo.', '', 4000); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => CT.toast('Relatório copiado.', 'win', 3000), fb);
      else fb();
    };
    let wiped = false;
    $('#wipe').onclick = function () {
      if (!wiped) { wiped = true; this.textContent = 'Toque de novo para confirmar'; return; }
      const mode = S().mode;
      CT.resetState(); S().mode = mode; CT.save(); registerMySongs(); go('prog');
    };
  };

  /* ---------- avaliação de nível ---------- */
  const PLACEMENT_V = [
    { key: 'range', name: 'Extensão da voz', spec: { kind: 'range' } },
    { key: 'mpt', name: 'Fôlego', spec: { kind: 'mpt' } },
    { key: 'hold', name: 'Nota sustentada', spec: { kind: 'hold', note: 0, title: 'Avaliação: nota sustentada' } },
    { key: 'scale', name: 'Afinação em escala', spec: { kind: 'steps', pattern: 'scale5', voice: 'main', guide: 'melody' } },
    { key: 'ear', name: 'Ouvido', spec: { kind: 'ear', n: 4 } },
    { key: 'song', name: 'Música com a voz principal', spec: { kind: 'melody', song: 'twinkle', voice: 'main', guide: 'target' } },
    { key: 'third', name: 'Segunda voz em degraus', spec: { kind: 'steps', pattern: 'step3', voice: 'third', guide: 'melody' } },
    { key: 'song2', name: 'Segunda voz em música', spec: { kind: 'melody', song: 'twinkle', voice: 'third', guide: 'melody' } }
  ];
  const PLACEMENT_G = [
    { key: 'open', name: 'Cordas soltas', spec: { kind: 'gnotes', list: 'open', title: 'Avaliação: cordas soltas' } },
    { key: 'frets', name: 'Notas nas casas', spec: { kind: 'gnotes', list: 'gscale', title: 'Avaliação: escala de Sol' } },
    { key: 'chords', name: 'Acordes abertos', spec: { kind: 'gchord', chords: ['Em', 'Am', 'G', 'C'] } },
    { key: 'seq', name: 'Troca de acordes', spec: { kind: 'gseq', chords: ['Em', 'Am', 'Em', 'Am'], bpm: 50, rounds: 1 } },
    { key: 'strum', name: 'Batida', spec: { kind: 'gstrum', pattern: 'D.D.D.D.', bpm: 60, bars: 4 } },
    { key: 'song', name: 'Melodia no violão', spec: { kind: 'melody', inst: 'g', song: 'twinkle', voice: 'main', guide: 'target', tonic: 55 } },
    { key: 'song2', name: 'Segunda voz no violão', spec: { kind: 'melody', inst: 'g', song: 'twinkle', voice: 'third', guide: 'melody', tonic: 55 } }
  ];
  const PARTS = () => (isG() ? PLACEMENT_G : PLACEMENT_V);

  function startPlacement() {
    CT.cleanupRun();
    nav.hidden = true;
    const parts = PARTS(), g = isG();
    view.innerHTML = '<button class="back" id="pback">‹ Sair</button><p class="eyebrow">Avaliação de nível' + (g ? ' · violão' : '') + '</p><h1>Vamos medir seu nível</h1>' +
      '<p class="sub">São ' + parts.length + ' partes curtas, cerca de ' + (g ? 8 : 10) + ' minutos. Não é prova: o objetivo é achar o seu ponto de partida no curso.</p>' +
      '<ol class="steps">' + parts.map((p) => '<li><b>' + p.name + '</b></li>').join('') + '</ol>' +
      '<div class="note-box">Use <b>fones de ouvido</b>, num lugar silencioso.' + (g ? ' Violão afinado: se precisar, afine antes em Treinar.' : ' Cante com naturalidade, sem tentar impressionar.') + ' Quanto mais honesto o resultado, melhor o curso se encaixa em você.</div>' +
      '<button class="btn primary big" id="pgo">Começar a avaliação</button>';
    $('#pback').onclick = () => go('home');
    $('#pgo').onclick = () => runPart(0, {});
  }
  function runPart(i, out) {
    const parts = PARTS(), part = parts[i];
    CT.runSpec(part.spec, {
      mode: 'test', last: i === parts.length - 1, crumb: 'Avaliação ' + (i + 1) + '/' + parts.length, back: () => go('home'),
      onDone: (res) => { out[part.key] = res; if (i + 1 < parts.length) runPart(i + 1, out); else finishPlacement(out); }
    });
  }
  const levelFor = (score, cuts) => { let lv = 1; cuts.forEach((c) => { if (score >= c) lv++; }); return lv; };
  const blend = (arr) => 0.7 * avg(arr) + 0.3 * Math.min(...arr);

  function finishPlacement(out) {
    const st = S(), g = isG();
    const d = (k, f, def) => (out[k] && out[k].data && out[k].data[f] != null ? out[k].data[f] : def);
    let skills, A, B;
    if (g) {
      skills = [
        { l: 'Notas soltas', v: d('open', 'pct', 0) }, { l: 'Notas nas casas', v: d('frets', 'pct', 0) },
        { l: 'Acordes', v: d('chords', 'pct', 0) }, { l: 'Troca de acordes', v: d('seq', 'pct', 0) }, { l: 'Batida', v: d('strum', 'pct', 0) },
        { l: 'Melodia', v: d('song', 'score', 0) }, { l: 'Segunda voz no violão', v: d('song2', 'score', 0) }
      ];
      A = blend([skills[2].v, skills[3].v, skills[4].v]);
      B = blend([avg([skills[0].v, skills[1].v]), skills[5].v, skills[6].v]);
    } else {
      skills = [
        { l: 'Fôlego', v: clamp((d('mpt', 'dur', 0) / 20) * 100, 0, 100) }, { l: 'Estabilidade', v: d('hold', 'score', 0) },
        { l: 'Afinação em escala', v: d('scale', 'pct', 0) }, { l: 'Ouvido', v: d('ear', 'pct', 0) },
        { l: 'Música (voz principal)', v: d('song', 'score', 0) }, { l: 'Segunda voz em degraus', v: d('third', 'pct', 0) },
        { l: 'Segunda voz em música', v: d('song2', 'score', 0) }
      ];
      A = blend(skills.slice(0, 5).map((s) => s.v));
      B = blend(skills.slice(5).map((s) => s.v));
    }
    const levelA = levelFor(A, [35, 55, 72]), levelB = levelFor(B, [30, 50, 70]);
    const key = g ? 'gplacement' : 'placement', prev = st[key];
    st[key] = { t: Date.now(), skills, A, B, levelA, levelB };
    MODS().forEach((m) => { delete st.course.waived[m.id]; });
    MODS().forEach((m) => {
      const lv = m.track === 'A' ? levelA : levelB;
      if (m.level < lv) st.course.waived[m.id] = true;
    });
    CT.save();
    CT.addHistory(g ? 'gplacement' : 'placement', { A, B }, 'Avaliação de nível' + (g ? ' (violão)' : '') + ': ' + Math.round(A) + ' e ' + Math.round(B) + ' (nível inicial ' + levelA + ' e ' + levelB + ')');
    nav.hidden = false;
    const waived = MODS().filter((m) => st.course.waived[m.id]);
    const label = (n) => ['', 'iniciante', 'básico', 'intermediário', 'avançado'][n];
    view.innerHTML = '<p class="eyebrow">Resultado</p><h1>Seu ponto de partida</h1>' +
      '<div class="two"><div class="card lvl a"><span>' + TRACKS().A.name + '</span><b>Nível ' + levelA + '</b><small>' + label(levelA) + ' · ' + Math.round(A) + ' pontos</small></div>' +
      '<div class="card lvl b"><span>' + TRACKS().B.name + '</span><b>Nível ' + levelB + '</b><small>' + label(levelB) + ' · ' + Math.round(B) + ' pontos</small></div></div>' +
      '<section class="card">' + bars(skills) + '</section>' +
      (prev ? '<p class="fine">Avaliação anterior: ' + Math.round(prev.A) + ' e ' + Math.round(prev.B) + '.</p>' : '') +
      '<p class="sub">' + (waived.length ? 'Dispensei ' + waived.length + ' módulo(s) que você já domina. Você pode refazê-los quando quiser.' : 'Você começa do primeiro módulo, com bases firmes para avançar.') + '</p>' +
      '<ul class="fine tips">' + skills.slice().sort((a, b) => a.v - b.v).slice(0, 2).map((s) => '<li>Ponto a reforçar: ' + s.l + ' (' + Math.round(s.v) + ')</li>').join('') + '</ul>' +
      '<button class="btn primary big" id="gocourse">Ir para o curso</button>';
    $('#gocourse').onclick = () => go('course');
    window.scrollTo(0, 0);
  }

  /* ---------- início do app ---------- */
  document.addEventListener('visibilitychange', () => {
    if (window.__noAbort) return;
    if (document.hidden) { CT.cleanupRun(); CT.Mic.release(); }
    else go(nav.hidden ? (returnTo || 'home') : current);
  });
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
  go('home');
})();

</script>
</body>
</html>
